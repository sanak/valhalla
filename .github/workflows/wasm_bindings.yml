name: Build WASM bindings

on:
  push:
    branches:
      - master
    tags:
      - '*'
  # on PRs only when the bindings, their tests, the interfaces they implement or any
  # CMakeLists change. tilegetter.h is here because js_tile_getter_t overrides its pure
  # virtuals, so a new one breaks the wasm build and nothing else. exceptions.h and the
  # dijkstras pair are here because the wasm suite cancels an isochrone, the one cancellation
  # path it can detect a regression in. The shape-match fallback guards in
  # trace_route_action.cc, trace_attributes_action.cc and triplegbuilder.cc are deliberately
  # absent: nothing here exercises them. The graphreader pair carries the remote index.bin the
  # suite routes over, and valhalla_build_extract builds its tar fixtures.
  pull_request:
    paths:
      - "src/bindings/wasm/**"
      - "test/bindings/wasm/**"
      - valhalla/tyr/actor.h
      - valhalla/baldr/tilegetter.h
      - valhalla/baldr/graphreader.h
      - src/baldr/graphreader.cc
      - scripts/valhalla_build_extract
      - valhalla/exceptions.h
      - valhalla/thor/dijkstras.h
      - src/thor/dijkstras.cc
      - src/thor/isochrone_action.cc
      - "**/CMakeLists.txt"
      - .github/workflows/wasm_bindings.yml
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_tiles:
    name: Build test tiles
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: .ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-wasm-tiles-${{ github.sha }}
          restore-keys: ccache-wasm-tiles-

      - name: Install dependencies
        run: |
          ./scripts/install-linux-deps.sh
          sudo apt-get install -y ninja-build python3-venv

      - name: Build tiles
        run: ./src/bindings/wasm/scripts/make_tiles.sh

      - name: Tar tiles
        run: tar -cf wasm-tiles.tar -C build-wasm tiles

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-tiles
          path: wasm-tiles.tar

  build_wasm:
    name: Cross-build the wasm module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # keyed on versions.env, so bumping a pinned version invalidates the cache and a stale
      # protobuf can never survive into a new build
      - name: Cache toolchain and cross-built deps
        uses: actions/cache@v4
        with:
          path: |
            build-wasm/emsdk
            build-wasm/protoc
            build-wasm/protobuf
            build-wasm/zlib
            build-wasm/prefix
          key: wasm-deps-${{ runner.os }}-${{ hashFiles('src/bindings/wasm/versions.env') }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libboost-dev python3-venv unzip

      - name: Build deps
        run: ./src/bindings/wasm/scripts/build_deps.sh

      - name: Build wasm module
        run: ./src/bindings/wasm/scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-module
          path: |
            build-wasm/build-valhalla/src/bindings/wasm/valhalla.mjs
            build-wasm/build-valhalla/src/bindings/wasm/valhalla.wasm

  test_wasm:
    name: Test the wasm bindings
    runs-on: ubuntu-24.04
    needs: [build_tiles, build_wasm]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          name: wasm-tiles

      - uses: actions/download-artifact@v4
        with:
          name: wasm-module
          path: wasm-module

      - name: Unpack tiles
        run: tar -xf wasm-tiles.tar

      - name: Install test dependencies
        working-directory: test/bindings/wasm
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Node smoke test
        env:
          VALHALLA_WASM: ${{ github.workspace }}/wasm-module/valhalla.mjs
          VALHALLA_TILE_DIR: ${{ github.workspace }}/tiles
        run: node test/bindings/wasm/tests.mjs

      - name: Browser test
        working-directory: test/bindings/wasm
        env:
          VALHALLA_WASM_DIR: ${{ github.workspace }}/wasm-module
          VALHALLA_TILE_DIR: ${{ github.workspace }}/tiles
        run: node browser/test_browser.mjs
